name: CI

# Runs on every push to any branch, and on every pull request.
on:
  push:
  pull_request:

jobs:
  checks:
    # Pinned image rather than ubuntu-latest, which moves to a new Ubuntu
    # release without notice. Same reasoning as uv.lock: change it on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Actions pinned to full commit SHAs, as uv's own documentation does.
      # A tag can be moved to different code; a SHA cannot.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      # --locked refuses to run if uv.lock is out of date with pyproject.toml,
      # so the environment CI tests is exactly the one that was locked.
      - name: Install the locked environment
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy, strict)
        run: uv run mypy src/moirai

      - name: Tests (pytest)
        run: uv run pytest
