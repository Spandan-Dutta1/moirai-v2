name: CI

# Runs on every push to any branch, and on every pull request.
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      # --locked refuses to run if uv.lock is out of date with pyproject.toml,
      # so the environment CI tests is exactly the one that was locked.
      - name: Install the locked environment
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy, strict)
        run: uv run mypy src/moirai

      - name: Tests (pytest)
        run: uv run pytest
