[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moirai"
version = "0.1.0"
description = "Local-first Economic Intelligence Platform"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "duckdb>=1.0",
    "pytz>=2024.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "scipy-stubs",
    "pandas-stubs",
    "types-openpyxl",
    "types-pytz",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moirai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]   # frozen-model errors vary by library version
"scripts/**" = ["E402"] # scratch scripts, not library code
"src/moirai/engine/financial/commercial_banks.py" = ["E501"]  # bank data table

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/moirai"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["statsmodels", "statsmodels.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
